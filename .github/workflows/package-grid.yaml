name: Package (grid)

on:
  push:
    branches: ['grid-4']
    tags: ['v*-grid.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: yarn install --no-immutable
      # Nothing is packaged or published unless these pass
      - run: yarn check-types
      - run: yarn lint
      - run: yarn knip
      - run: yarn test
      - run: yarn package

      - uses: actions/upload-artifact@v4
        with:
          name: allenheath-sq-grid-4
          path: '*.tgz'
          if-no-files-found: error

      # A push to grid-4 whose package.json version has no release yet
      # publishes it: tag v<version>, pre-release if the version has a hyphen,
      # notes from .github/RELEASE_NOTES.md.  (Claude sessions can push
      # branches but not tags, so this is how a build gets published.)
      - name: Work out the release
        id: release
        if: github.ref == 'refs/heads/grid-4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          case "${version}" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Publish a new version
        if: github.ref == 'refs/heads/grid-4' && steps.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: '*.tgz'

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
